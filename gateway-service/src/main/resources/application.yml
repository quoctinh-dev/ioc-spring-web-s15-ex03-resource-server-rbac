server:
    port: 8080

spring:
    application:
        name: gateway-service
    cloud:
        gateway:
            routes:
                - id: identity-service
                  uri: http://localhost:8081
                  predicates:
                      - Path=/api/auth/**

                - id: course-service
                  uri: http://localhost:8082
                  predicates:
                      - Path=/api/courses/**

